services:
  postgres:
    image: postgres:16
    container_name: tarefas-postgres
    environment:
      POSTGRES_DB: tarefas
      POSTGRES_USER: tarefas
      POSTGRES_PASSWORD: tarefas
    ports:
      - "5434:5432"
    volumes:
      - tarefas-dados:/var/lib/postgresql/data

volumes:
  tarefas-dados:
